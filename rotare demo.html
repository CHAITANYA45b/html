<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .container {
            width: 200px;
            height: 200px;
            perspective: 1000px; /* Define the perspective for the 3D effect */
        }

        .rotating-box {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d; /* Preserve 3D transformations */
            animation: rotate 5s infinite linear; /* Apply rotation animation */
        }

        .box-face {
            position: absolute;
            width: 200px;
            height: 200px;
            background: rgba(0, 128, 128, 0.7);
            border: 1px solid #000;
        }

        .front  { transform: rotateY(  0deg) translateZ(100px); }
        .back   { transform: rotateY(180deg) translateZ(100px); }
        .left   { transform: rotateY(-90deg) translateZ(100px); }
        .right  { transform: rotateY( 90deg) translateZ(100px); }
        .top    { transform: rotateX( 90deg) translateZ(100px); }
        .bottom { transform: rotateX(-90deg) translateZ(100px); }

        @keyframes rotate {
            from { transform: rotateY(0deg); }
            to   { transform: rotateY(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="rotating-box">
            <div class="box-face front">Front</div>
            <div class="box-face back">Back</div>
            <div class="box-face left">Left</div>
            <div class="box-face right">Right</div>
            <div class="box-face top">Top</div>
            <div class="box-face bottom">Bottom</div>
        </div>
    </div>
</body>
</html>
